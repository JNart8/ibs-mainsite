# Uploads the website to the live server over FTPS.
# Run it by hand: Actions tab → "Deploy website" → Run workflow.
# "Dry run" is ticked by default: it logs in and lists what would be
# uploaded without changing anything. Untick it to really deploy.
# It doesn't run on push yet, so nothing goes live until someone runs it.
# Once the site is approved, add `push: branches: [main]` under `on:` to
# deploy every change to main.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.ibsolutionsglobal.com
#   FTP_USERNAME
#   FTP_PASSWORD
# Optional repo variable:
#   FTP_SERVER_DIR  the web root as the FTP account sees it, ending in "/".
#                   Defaults to "./" (an account whose root is the web root).
#                   Use "public_html/" for the main cPanel account.
#
# Only index.html and assets/ are uploaded. Files already on the server
# that this workflow didn't upload are never deleted. The first run
# overwrites the old index.html, so back it up from cPanel first.
name: Deploy website

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (log in and list changes, upload nothing)
        type: boolean
        default: true

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # index.html links site.css?v=dev and site.js?v=dev. Swap "dev" for
      # this commit, so a cached old stylesheet or script is never used
      # with a newer page.
      - name: Stamp the CSS and JS links with this commit
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s/site\.css?v=dev/site.css?v=$v/; s/site\.js?v=dev/site.js?v=$v/" index.html
          test "$(grep -c "?v=$v" index.html)" -eq 2

      # Pinned to the v4.4.0 commit: this action receives the FTP password
      - uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dry-run: ${{ inputs.dry_run }}
          # Excluded paths are never uploaded or deleted on the server
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
