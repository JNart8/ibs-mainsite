# Uploads the website to the live server (Hostinger) over SSH with rsync.
# It runs by itself on every push to main (merged pull requests included)
# and deploys for real. Pushes that only change README.md don't deploy.
# It can also be run by hand: Actions tab → "Deploy website" → Run
# workflow. There "Dry run" is ticked by default: it connects and lists
# what would be uploaded without changing anything.
#
# Required repo secret (Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY  the private half of a key added in hPanel →
#                    Advanced → SSH Access (named "ibs-github-deploy")
# Optional repo variables, to override the defaults below:
#   SSH_HOST, SSH_PORT, SSH_USER, DEPLOY_PATH (the web root, ending in "/"),
#   SSH_KNOWN_HOSTS (the server's host key lines, if they ever change)
#
# index.html, 404.html, .htaccess, assets/ and help/ (the user manuals) are
# uploaded. Files already on the server that this workflow didn't upload are
# never deleted: the app subdomains' folders live in the same web root.
name: Deploy website

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (connect and list changes, upload nothing)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ vars.SSH_HOST || '217.65.157.84' }}
      SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
      SSH_USER: ${{ vars.SSH_USER || 'u795144365' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/u795144365/domains/ibsolutionsglobal.com/public_html/' }}
      SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
      # Pushes always deploy; a hand run follows its "Dry run" box
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      # index.html links site.css?v=dev and site.js?v=dev. Swap "dev" for
      # this commit, so a cached old stylesheet or script is never used
      # with a newer page.
      - name: Stamp the CSS and JS links with this commit
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s/site\.css?v=dev/site.css?v=$v/; s/site\.js?v=dev/site.js?v=$v/" index.html
          test "$(grep -c "?v=$v" index.html)" -eq 2

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::The SSH_PRIVATE_KEY secret isn't set. See the notes at the top of this workflow."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's public host keys, so the deploy refuses to talk to an impostor.
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            cat > ~/.ssh/known_hosts <<'EOF'
          [217.65.157.84]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINqdAGuE4tw+pGdHVvOmgkZDTdcu+UzEvTHZ5YV7+0kt
          [217.65.157.84]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBPJn943pF+j+tJ26SSk33IuUzgFwy9waiKbu/4iIwh3SXAXgsDqfbTRTSreT5QxO+PXQRcdquNH2hlRJtRnoqW0=
          EOF
          fi
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF
          ssh server "test -d '$DEPLOY_PATH'" || { echo "::error::$DEPLOY_PATH isn't a folder on the server. Set the DEPLOY_PATH variable."; exit 1; }

      # Only changed files are sent (compared by content). No --delete:
      # nothing on the server is ever removed.
      - name: Upload changed files
        run: |
          flags=""
          [ "$DRY_RUN" = "true" ] && flags="--dry-run" && echo "Dry run: nothing will be changed."
          rsync --recursive --perms --chmod=D755,F644 --compress --checksum \
            --itemize-changes --stats $flags \
            --exclude='.git*' --exclude='.help-site-build' \
            index.html 404.html .htaccess assets help \
            "server:$DEPLOY_PATH"
